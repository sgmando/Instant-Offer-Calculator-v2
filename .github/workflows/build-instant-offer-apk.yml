name: Build Instant Offer APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/build-instant-offer-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/Instant-Offer-Calculator.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Instant-Offer-Calculator-APK
          path: Instant-Offer-Calculator.apk
          if-no-files-found: error
          compression-level: 0

      - name: Publish easy-download release
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view instant-offer-latest >/dev/null 2>&1; then
            gh release upload instant-offer-latest Instant-Offer-Calculator.apk --clobber
          else
            gh release create instant-offer-latest Instant-Offer-Calculator.apk \
              --title "Instant Offer Calculator APK" \
              --notes "Download Instant-Offer-Calculator.apk and install it on your Android phone." \
              --target "$GITHUB_SHA" \
              --prerelease
          fi
