plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sgmando.instantoffer'
    compileSdk 35

    defaultConfig {
        applicationId "com.sgmando.instantoffer"
        minSdk 23
        targetSdk 35
        versionCode 5
        versionName "1.1.2"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
